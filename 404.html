<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>2FAGO 验证码</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --bg-glow-a: rgba(84, 196, 144, 0.15);
        --bg-glow-b: rgba(76, 170, 255, 0.12);
        --panel: rgba(17, 19, 24, 0.88);
        --panel-strong: rgba(13, 14, 18, 0.94);
        --panel-soft: rgba(255, 255, 255, 0.03);
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --text: #f4f7fb;
        --muted: #9298a6;
        --accent: #86efbe;
        --accent-2: #60d6ff;
        --danger: #ff7d7d;
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f7fb;
        --bg-glow-a: rgba(92, 190, 142, 0.16);
        --bg-glow-b: rgba(79, 149, 255, 0.14);
        --panel: rgba(255, 255, 255, 0.84);
        --panel-strong: rgba(255, 255, 255, 0.94);
        --panel-soft: rgba(20, 27, 44, 0.04);
        --line: rgba(18, 28, 45, 0.09);
        --line-strong: rgba(18, 28, 45, 0.15);
        --text: #111827;
        --muted: #667085;
        --accent: #1ea672;
        --accent-2: #2388ff;
        --danger: #d84545;
        --shadow: 0 28px 70px rgba(114, 132, 167, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        padding: 18px;
        color: var(--text);
        font-family: "Satoshi", "Avenir Next", "Segoe UI", "PingFang SC",
          "Noto Sans SC", sans-serif;
        background:
          radial-gradient(circle at top left, var(--bg-glow-a), transparent 28%),
          radial-gradient(circle at top right, var(--bg-glow-b), transparent 26%),
          var(--bg);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 38px 38px;
        opacity: 0.45;
        mask-image: radial-gradient(circle at center, black 42%, transparent 88%);
        pointer-events: none;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(100%, 1180px);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel-soft);
        font-size: 14px;
        font-weight: 700;
      }

      .brand-copy strong {
        display: block;
        font-size: 15px;
        font-weight: 700;
      }

      .brand-copy span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-soft);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .theme-icon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      .theme-icon svg {
        width: 15px;
        height: 15px;
        display: block;
      }

      .theme-label {
        font-size: 13px;
        font-weight: 600;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
        gap: 18px;
        margin-top: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 30px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .otp-panel {
        padding: 24px;
        min-height: 100%;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .otp-code {
        margin: 18px 0 0;
        font-size: clamp(60px, 10vw, 112px);
        line-height: 0.9;
        letter-spacing: 0.08em;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 28px rgba(134, 239, 190, 0.16);
      }

      .status {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .status.error {
        color: var(--danger);
      }

      .progress {
        height: 9px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--panel-soft);
      }

      .progress-bar {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.4s ease;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .stat {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel-soft);
      }

      .stat span {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .stat strong {
        display: block;
        font-size: 22px;
        font-weight: 700;
      }

      .side {
        display: grid;
        gap: 18px;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .input-panel {
        padding: 24px;
      }

      .input-panel h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .input-panel p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .secret-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        margin-top: 22px;
      }

      .secret-input {
        width: 100%;
        min-width: 0;
        padding: 15px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 18px;
        outline: none;
        background: var(--panel-soft);
        color: var(--text);
        font-family: "SFMono-Regular", "Menlo", "Monaco", monospace;
        font-size: 14px;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .secret-input::placeholder {
        color: var(--muted);
      }

      .secret-input:focus {
        border-color: rgba(134, 239, 190, 0.45);
        box-shadow: 0 0 0 4px rgba(134, 239, 190, 0.12);
      }

      .action-button {
        padding: 15px 18px;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #06110d;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .mini-card {
        padding: 20px;
      }

      .mini-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .mini-card h2 {
        margin: 0;
        font-size: 16px;
      }

      .mini-card p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .path {
        display: inline-block;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        color: var(--text);
        font-family: "SFMono-Regular", "Menlo", "Monaco", monospace;
        font-size: 12px;
        word-break: break-all;
      }

      .copy-button {
        flex-shrink: 0;
        padding: 9px 12px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--panel-soft);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .copy-button:hover,
      .action-button:hover,
      .theme-toggle:hover {
        filter: brightness(1.03);
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        body {
          padding: 14px;
        }

        .topbar {
          padding: 12px;
        }

        .brand-copy span {
          display: none;
        }

        .secret-form,
        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">2F</div>
          <div class="brand-copy">
            <strong>2FAGO / 动态验证码</strong>
            <span>输入密钥或访问专属链接，实时查看当前动态验证码</span>
          </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色">
          <span class="theme-icon" id="theme-icon" aria-hidden="true"></span>
          <span class="theme-label" id="theme-label">深色模式</span>
        </button>
      </header>

      <main class="workspace">
        <section class="panel otp-panel">
          <p class="eyebrow">Dynamic Verification Code</p>
          <h1 class="otp-code" id="otp-code">------</h1>
          <p class="status" id="status-text">请输入密钥，或直接访问专属链接以查看当前验证码。</p>
          <div class="progress" aria-hidden="true">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="stats">
            <div class="stat">
              <span>剩余时间</span>
              <strong id="seconds-left">--s</strong>
            </div>
            <div class="stat">
              <span>周期</span>
              <strong>30s</strong>
            </div>
            <div class="stat">
              <span>算法</span>
              <strong>SHA-1</strong>
            </div>
          </div>
        </section>

        <section class="side">
          <section class="panel input-panel">
            <h1>输入密钥并打开专属链接</h1>
            <p>输入 Base32 密钥后，系统会在当前页面打开对应链接，并立即显示该密钥的动态验证码。</p>
            <form class="secret-form" id="secret-form">
              <input
                class="secret-input"
                id="secret-input"
                type="text"
                inputmode="latin"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="请输入 Base32 格式密钥"
              />
              <button class="action-button" type="submit">打开链接</button>
            </form>
            <div class="path" id="target-url"></div>
          </section>

          <section class="panel mini-card">
            <div class="mini-head">
              <h2>使用方式</h2>
              <button class="copy-button" id="copy-example" type="button">复制链接</button>
            </div>
            <p>你也可以将密钥直接写入地址栏，页面会自动读取并生成验证码。</p>
            <div class="path" id="example-url"></div>
          </section>

          <section class="panel mini-card">
            <h2>安全提示</h2>
            <p>链接中包含密钥时，任何获得该链接的人都可以生成相同验证码。请仅在可信环境中使用，并避免对外分享。</p>
          </section>
        </section>
      </main>
    </div>

    <script>
      const PERIOD = 30;
      const DIGITS = 6;
      const BASE32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      const THEME_STORAGE_KEY = "2fago-theme";

      const codeEl = document.getElementById("otp-code");
      const statusEl = document.getElementById("status-text");
      const secondsEl = document.getElementById("seconds-left");
      const progressEl = document.getElementById("progress-bar");
      const exampleEl = document.getElementById("example-url");
      const secretFormEl = document.getElementById("secret-form");
      const secretInputEl = document.getElementById("secret-input");
      const targetUrlEl = document.getElementById("target-url");
      const themeToggleEl = document.getElementById("theme-toggle");
      const themeIconEl = document.getElementById("theme-icon");
      const themeLabelEl = document.getElementById("theme-label");
      const copyExampleEl = document.getElementById("copy-example");

      const THEME_ICONS = {
        dark:
          '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18.5 14.5A7 7 0 0 1 9.5 5.5a7.5 7.5 0 1 0 9 9Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        light:
          '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      };

      let currentSecret = "";
      let lastCounter = -1;

      function extractSecret() {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const querySecret = new URLSearchParams(window.location.search).get("secret");

        if (querySecret) {
          return decodeURIComponent(querySecret);
        }

        if (parts.length === 0) {
          return "";
        }

        if (parts[0].toLowerCase() === "2fago") {
          return decodeURIComponent(parts.slice(1).join(""));
        }

        return decodeURIComponent(parts[parts.length - 1]);
      }

      function normalizeSecret(secret) {
        return secret.toUpperCase().replace(/[\s-]+/g, "").replace(/=+$/g, "");
      }

      function getRoutingBase() {
        const parts = window.location.pathname.split("/").filter(Boolean);
        return parts[0]?.toLowerCase() === "2fago" ? "/2fago/" : "/";
      }

      function buildSecretUrl(secret) {
        const normalized = normalizeSecret(secret);
        const base = getRoutingBase();
        return window.location.origin + (normalized ? base + encodeURIComponent(normalized) : base);
      }

      function decodeBase32(secret) {
        let bits = "";
        const bytes = [];

        for (const char of secret) {
          const value = BASE32_ALPHABET.indexOf(char);
          if (value === -1) {
            throw new Error("密钥不是有效的 Base32 格式");
          }
          bits += value.toString(2).padStart(5, "0");
        }

        for (let index = 0; index + 8 <= bits.length; index += 8) {
          bytes.push(Number.parseInt(bits.slice(index, index + 8), 2));
        }

        return new Uint8Array(bytes);
      }

      function formatCode(code) {
        return code.replace(/(\d{3})(\d{3})/, "$1 $2");
      }

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        themeIconEl.innerHTML = theme === "light" ? THEME_ICONS.light : THEME_ICONS.dark;
        themeLabelEl.textContent = theme === "light" ? "浅色模式" : "深色模式";
        window.localStorage.setItem(THEME_STORAGE_KEY, theme);
      }

      function initTheme() {
        const stored = window.localStorage.getItem(THEME_STORAGE_KEY);
        if (stored === "light" || stored === "dark") {
          setTheme(stored);
          return;
        }

        const prefersLight = window.matchMedia?.("(prefers-color-scheme: light)")?.matches;
        setTheme(prefersLight ? "light" : "dark");
      }

      async function generateTotp(secret, timestampMs) {
        if (!window.crypto?.subtle) {
          throw new Error("当前浏览器不支持 Web Crypto");
        }

        const secretBytes = decodeBase32(secret);
        if (secretBytes.length === 0) {
          throw new Error("密钥不能为空");
        }

        const counter = Math.floor(timestampMs / 1000 / PERIOD);
        const counterBytes = new Uint8Array(8);
        const counterView = new DataView(counterBytes.buffer);
        counterView.setUint32(0, Math.floor(counter / 0x100000000), false);
        counterView.setUint32(4, counter >>> 0, false);

        const key = await window.crypto.subtle.importKey(
          "raw",
          secretBytes,
          { name: "HMAC", hash: "SHA-1" },
          false,
          ["sign"]
        );

        const signature = new Uint8Array(
          await window.crypto.subtle.sign("HMAC", key, counterBytes)
        );

        const offset = signature[signature.length - 1] & 0x0f;
        const binary =
          ((signature[offset] & 0x7f) << 24) |
          ((signature[offset + 1] & 0xff) << 16) |
          ((signature[offset + 2] & 0xff) << 8) |
          (signature[offset + 3] & 0xff);

        return String(binary % 10 ** DIGITS).padStart(DIGITS, "0");
      }

      function updateTargetUrlPreview() {
        targetUrlEl.textContent = buildSecretUrl(secretInputEl.value || currentSecret);
      }

      async function copyText(text) {
        if (window.navigator?.clipboard?.writeText) {
          await window.navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }

      async function render() {
        currentSecret = normalizeSecret(extractSecret());

        const now = Date.now();
        const currentSecond = Math.floor(now / 1000);
        const counter = Math.floor(currentSecond / PERIOD);
        const secondsLeft = PERIOD - (currentSecond % PERIOD);
        const progress = ((PERIOD - secondsLeft) / PERIOD) * 100;

        secondsEl.textContent = secondsLeft + "s";
        progressEl.style.width = progress + "%";
        exampleEl.textContent = buildSecretUrl("JBSWY3DPEHPK3PXP");

        if (document.activeElement !== secretInputEl) {
          secretInputEl.value = currentSecret;
        }

        updateTargetUrlPreview();

        if (!currentSecret) {
          codeEl.textContent = "------";
          statusEl.textContent = "请输入密钥，或直接访问专属链接以查看当前验证码。";
          statusEl.classList.remove("error");
          lastCounter = -1;
          return;
        }

        if (counter === lastCounter) {
          return;
        }

        try {
          const otp = await generateTotp(currentSecret, now);
          codeEl.textContent = formatCode(otp);
          statusEl.textContent = "验证码正在本地生成，并将在当前周期结束后自动刷新。";
          statusEl.classList.remove("error");
          lastCounter = counter;
        } catch (error) {
          codeEl.textContent = "ERROR";
          statusEl.textContent = error.message || "验证码生成失败";
          statusEl.classList.add("error");
          lastCounter = -1;
        }
      }

      secretInputEl.addEventListener("input", updateTargetUrlPreview);
      secretFormEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const normalized = normalizeSecret(secretInputEl.value);

        if (!normalized) {
          statusEl.textContent = "请先输入 Base32 密钥。";
          statusEl.classList.add("error");
          secretInputEl.focus();
          updateTargetUrlPreview();
          return;
        }

        window.location.href = buildSecretUrl(normalized);
      });

      copyExampleEl.addEventListener("click", async () => {
        try {
          await copyText(exampleEl.textContent);
          copyExampleEl.textContent = "已复制";
          setTimeout(() => {
            copyExampleEl.textContent = "复制链接";
          }, 1400);
        } catch (error) {
          copyExampleEl.textContent = "复制失败";
          setTimeout(() => {
            copyExampleEl.textContent = "复制链接";
          }, 1400);
        }
      });

      themeToggleEl.addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        setTheme(nextTheme);
      });

      initTheme();
      render();
      setInterval(render, 1000);
    </script>
  </body>
</html>
